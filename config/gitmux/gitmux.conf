# Dots: editable gitmux layout; colors come from the tmux theme options.
# Starship appearance; gitmux owns counts. The tmux adapter joins metric totals.
tmux:
    # The symbols section defines the symbols printed before specific elements
    # of Git status displayed in tmux status string.
    symbols:
        # current branch name.
        branch: ""
        # Git SHA1 hash (in 'detached' state).
        hashprefix: ":"
        # 'ahead count' when local and remote branch diverged.
        ahead: "#[fg=#{s/^reset$/default/:@dots-gitmux-ahead},nobold,nounderscore,noreverse]⇡"
        # 'behind count' when local and remote branch diverged.
        behind: "#[fg=#{s/^reset$/default/:@dots-gitmux-behind},nobold,nounderscore,noreverse]⇣"
        # count of files in the staging area.
        staged: "+"
        # count of files in conflicts.
        conflict: "="
        # count of modified files.
        modified: "!"
        # count of untracked files.
        untracked: "?"
        # count of stash entries.
        stashed: "*"
        # count of inserted lines (stats section).
        insertions: "+"
        # count of deleted lines (stats section).
        deletions: "-"
        # Shown when the working tree is clean (hidden to match Starship).
        clean: "✔"

    # Styles are tmux format strings used to specify text colors and attributes
    # of Git status elements. See the STYLES section of tmux man page.
    # https://man7.org/linux/man-pages/man1/tmux.1.html#STYLES.
    styles:
        # Clear previous style.
        clear: "#[default,none]"
        # Special tree state strings such as [rebase], [merge], etc.
        state: "#[fg=#{s/^reset$/default/:@dots-gitmux-conflict},bold,nounderscore,noreverse]"
        # Local branch name
        branch: "#[fg=#{s/^reset$/default/:@dots-gitmux-branch},nobold,nounderscore,noreverse]"
        # Remote branch name
        remote: "#[fg=#{s/^reset$/default/:@dots-gitmux-muted},nobold,nounderscore,noreverse]"
        # The ahead/behind symbols supply separate styles; the adapter colors divergence.
        divergence: "#[default,none]"
        # 'staged' count
        staged: "#[fg=#{s/^reset$/default/:@dots-gitmux-staged},nobold,nounderscore,noreverse]"
        # 'conflicts' count
        conflict: "#[fg=#{s/^reset$/default/:@dots-gitmux-conflict},nobold,nounderscore,noreverse]"
        # 'modified' count
        modified: "#[fg=#{s/^reset$/default/:@dots-gitmux-modified},bold,nounderscore,noreverse]"
        # 'untracked' count
        untracked: "#[fg=#{s/^reset$/default/:@dots-gitmux-untracked},bold,nounderscore,noreverse]"
        # 'stash' count
        stashed: "#[fg=#{s/^reset$/default/:@dots-gitmux-muted},nobold,nounderscore,noreverse]"
        # 'insertions' count
        insertions: "#[fg=#{s/^reset$/default/:@dots-gitmux-added},nobold,nounderscore,noreverse]"
        # 'deletions' count
        deletions: "#[fg=#{s/^reset$/default/:@dots-gitmux-deleted},nobold,nounderscore,noreverse]"
        # 'clean' symbol
        clean: "#[fg=#{s/^reset$/default/:@dots-gitmux-clean},nobold,nounderscore,noreverse]"

    # The layout section defines what components gitmux shows and the order in
    # which they appear on tmux status bar.
    #
    # Allowed components:
    #  - branch:            local branch name. Examples: `main`, `:345e7a0` or `[rebase]`
    #  - remote-branch:     remote branch name, for example: `origin/main`.
    #  - divergence:        divergence between local and remote branch, if any. Example: `⇡1⇣2`
    #  - remote:            alias for `remote-branch` followed by `divergence`, for example: `origin/main ⇡1⇣2`
    #  - flags:             symbols representing the working tree state, for example `!1 *1 ?2`
    #  - stats:             insertions/deletions (lines), for example`+56-21`
    #  - some string `foo`: any other character of string is directly shown, for example `foo` or `|`
    layout: [branch, divergence, flags, stats]

    # Additional configuration options.
    options:
        # Maximum displayed length for local and remote branch names.
        branch_max_len: 24
        # Trim left, right or from the center of the branch (`right`, `left` or `center`).
        branch_trim: right
        # Character indicating whether and where a branch was truncated.
        ellipsis: …
        # Hides the clean flag
        hide_clean: true
        # Swaps order of behind & ahead upstream counts - "⇣1⇡1" -> "⇡1⇣1".
        swap_divergence: true
        # Add a space between behind & ahead upstream counts.
        divergence_space: false
        # Show flags symbols without counts.
        flags_without_count: false
