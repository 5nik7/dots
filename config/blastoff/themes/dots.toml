# Dots palette; module styles and layout remain editable.
# Theme refresh updates only [palettes.dots].
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

scan_timeout = 10000
command_timeout = 10000

format = """
$directory\
($git_branch\
$git_commit\
$git_status\
$git_metrics\
$git_state)\
$status\
$line_break\
$character\
"""

palette = 'dots'

[os]
disabled = true
style = "fg:red"
format = '[$symbol]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
disabled = true
show_always = false
style_user = "fg:red"
style_root = "bold fg:error"
format = '[$user]($style)'

[hostname]
disabled = true
ssh_only = true
style = "fg:red"
format = '[@$hostname]($style)'

[directory]
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) "
repo_root_style = "fg:git_repo"
before_repo_root_style = "fg:blue"
read_only_style = "fg:error"
style = "fg:blue"
format = "[$path]($style) "
truncation_length = 0
truncate_to_repo = false
fish_style_pwd_dir_length = 0
use_logical_path = true

[git_branch]
symbol = ""
style = "fg:git_branch"
format = '([$symbol$branch]($style) )'
only_attached = true
ignore_branches = []
truncation_length = 25
truncation_symbol = "..."
always_show_remote = false
disabled = false

[git_commit]
style = "fg:magenta"
format = "[($tag)(@$hash)]($style)"
commit_hash_length = 7
only_detached = true
tag_symbol = "󰓼 "
tag_disabled = false
disabled = false

[git_status]
style = "fg:cyan"
format = '([$ahead_behind]($style) )([$all_status]($style) )'
stashed = "[*${count}](fg:muted)"
ahead = "[⇡${count}](fg:git_ahead)"
behind = "[⇣${count}](fg:git_behind)"
up_to_date = ""
diverged = "[⇡${ahead_count}⇣${behind_count}](fg:git_conflict)"
conflicted = "([=${count}](fg:git_conflict) )"
deleted = "([×${count}](fg:git_deleted bold) )"
renamed = "([»${count}](fg:git_renamed bold) )"
modified = "([!${count}](fg:git_modified bold) )"
staged = "[+${count}](fg:git_staged)"
untracked = "[?${count}](fg:git_untracked bold)"
ignore_submodules = false
disabled = false

[git_metrics]
format = '([([+$added]($added_style))([-$deleted]($deleted_style))](fg:cyan) )'
added_style = "fg:git_added"
deleted_style = "fg:git_deleted"
only_nonzero_diffs = true
disabled = false

[git_state]
style = "fg:git_conflict"
format = '([$state( $progress_current/$progress_total)]($style bold) )'
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
disabled = false

[nodejs]
not_capable_style = "bold fg:error"
symbol = ""
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[c]
symbol = ""
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[rust]
symbol = "󱘗"
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[golang]
not_capable_style = "bold fg:error"
disabled = true
symbol = "󰟓"
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[php]
symbol = ""
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[java]
symbol = ""
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[kotlin]
symbol = ""
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[haskell]
