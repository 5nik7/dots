style = "fg:blue"
format = '( [$symbol( $version)( $virtualenv)]($style) )'
version_format = '${raw}'

[package]
disabled = false
symbol = "󰏗"
style = "fg:blue"
format = '( [$symbol( $version)]($style) )'

[docker_context]
symbol = ""
style = "fg:blue"
format = '( [$symbol( $context)]($style) )'

[kubernetes]
symbol = "󱃾"
style = "fg:magenta"
format = '( [($symbol( $cluster))]($style) )'
disabled = false

[shell]
disabled = true
format = '[  $indicator ]($style)'
bash_indicator = "bash"
fish_indicator = "fish"
zsh_indicator = "zsh"
powershell_indicator = "powershell"
pwsh_indicator = "pwsh"
ion_indicator = "ion"
elvish_indicator = "elvish"
tcsh_indicator = "tcsh"
xonsh_indicator = "xonsh"
cmd_indicator = "cmd"
nu_indicator = "nu"
unknown_indicator = ""
style = "fg:muted"

[container]
style = "fg:cyan"
format = '( [$symbol $name]($style) )'

[jobs]
symbol = "󰒋"
style = "fg:accent"
format = '( [$symbol( $number)]($style) )'
symbol_threshold = 1
number_threshold = 1

[time]
disabled = true
time_format = "%R"
style = "fg:muted"
format = '( [󰔛 $time]($style) )'

[cmd_duration]
min_time = 2000
format = '( [󱫑 $duration]($style) )'
style = 'fg:muted'
show_milliseconds = false
disabled = true

[status]
success_style = "bold fg:green"
failure_style = "bold fg:error"
disabled = true
format = '([$symbol( $common_meaning)( $signal_name)]($style) )'
map_symbol = true
pipestatus = true
symbol = '󰅙'
success_symbol = ''
not_executable_symbol = '󰂭'
not_found_symbol = '󰍉'
sigint_symbol = '󰐊'
signal_symbol = '󱐋'
style = 'bold fg:error'
recognize_signal_code = true

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:error)'
vimcmd_symbol = '[▎](bold fg:muted)'
vimcmd_replace_one_symbol = '[▎](bold fg:magenta)'
vimcmd_replace_symbol = '[▎](bold fg:magenta)'
vimcmd_visual_symbol = '[▎](bold fg:yellow)'

[aws]
style = "bold fg:cyan"

[azure]
style = "bold fg:cyan"

