# wttr uses this file when no user config exists. No location is sent implicitly.
default_location = ""    # nonempty overrides auto city; --location wins
units = "us"             # us (Fahrenheit/mph/in) or metric
language = "en"
days = 3                 # wttr.in j1 provides up to three days
timeout = 20             # total foreground refresh deadline, seconds
ttl = 900                # weather freshness, seconds
max_stale = 21600        # maximum retained weather age, seconds
location_max_age = 86400 # background cached city fix, seconds
# Optional manual styling: "{icon_color}{icon}{reset} {temp_color}{temperature}{unit}{reset}"
widget = "{icon_color}{icon}{reset} {temp_color}{temperature}{unit}{stale_marker}"
show_location_attribution = false                                                  # hide the wrapper's Location data row
widget_color = "auto"                                                              # auto (TTY), always, never; CLI/env override
widget_color_format = "ansi"                                                       # ansi, plain, tmux (explicit status markup)

label_gap = 3 # spaces after the aligned label column in human weather output (1–8)

[temperature_scale]
unit = "F" # thresholds can use F or C, independent of display
# First bound is inclusive; subsequent bounds begin the next warmer band.
# N increasing thresholds need N+1 styles; [] with one style covers all temperatures.
# <=32 cyan, <45 blue, <65 green, <80 yellow, <95 orange, >=95 red.
thresholds = [32, 49, 75, 85, 95]
# Names follow the current theme; literal overrides can be mixed, e.g. "#89b4fa", 33.
# Add bold/b, italic/i, underline/u, dim/d, reverse: "underline bold bright red".
# bright selects a standard color variant (bright blue = bright_blue), not bold.
colors = [
  "bold 51",
  "bold bright cyan",
  "bold green",
  "bright bold yellow",
  "bold 216",
  "bright bold red",
]

