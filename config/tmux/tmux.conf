# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Browse keybinding categories" ? run-shell -b 'dots keys --browse; _dots_keys_status=$?; if [ "$_dots_keys_status" -eq 130 ]; then exit 0; fi; exit "$_dots_keys_status"'

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=#{?#{!=:#{TERMUX_VERSION},},#{@dots-termux-lower-bg},default},fg=default"
set -g @dots-session-style "#[fg=black,bg=blue,bold]"
set -g @dots-termux-bg default
set -g @dots-termux-fg default
set -g @dots-termux-inactive-bg default
set -g @dots-termux-inactive-fg cyan
set -g @dots-termux-current-bg cyan
set -g @dots-termux-current-fg black
set -g @dots-termux-lower-bg default
set -g @dots-termux-window-bg black
set -g @dots-termux-window-fg white
set -g @dots-termux-selected-bg brightblack
set -g @dots-termux-clock-bg black
set -g @dots-termux-clock-fg default
set -g @dots-termux-muted brightblack
set -g @dots-termux-hint cyan
set -g @dots-termux-red red
set -g @dots-termux-yellow yellow
set -g @dots-termux-green green
set -g @dots-termux-blue blue
set -g window-status-format "#[fg=#{?#{!=:#{TERMUX_VERSION},},#{@dots-termux-window-fg},brightblack},bg=#{?#{!=:#{TERMUX_VERSION},},#{@dots-termux-window-bg},default}] #{?@dots-window-label,#{E:@dots-window-label},#I:#W} "
set -g window-status-current-format "#[fg=blue,bold,nounderscore,bg=#{@dots-termux-selected-bg}] #{?@dots-window-label,#{E:@dots-window-label},#I:#W} "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
set -g popup-border-lines single  # single double rounded heavy simple padded none
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=brightblack,bg=default"
set -g @dots-indicator-fg black
set -g @dots-indicator-bg green
set -g @dots-prefix-fg blue
set -g @dots-prefix-bg black

# Shared dots colors; optional until first activation.
source-file -q -F "#{d:current_file}/dots-theme.conf"

# Layout belongs here, after the include (including older generated themes).
set -g @dots-window-label '#{?#{!=:#{TERMUX_VERSION},},#I#{?#{==:#{window_name},#{session_name}},,:#{q/h:window_name}},#I:#W}'
set -g window-status-current-style nounderscore
set -g status-left '#{?@dots-termux-default,,#{@dots-session-style} #S #[default] }'
set -g status-right '#[fg=#{@dots-indicator-fg},bg=#{@dots-indicator-bg},bold]#{?pane_in_mode, COPY ,}#[default]#[fg=#{@dots-prefix-fg},bg=#{@dots-prefix-bg},bold]#{?client_prefix, PREFIX ,}#[default]#[fg=#{@dots-indicator-fg},bg=#{@dots-indicator-bg},bold]#{?window_zoomed_flag, ZOOM ,}#[default]'

# Start from tmux's standard window row on every reload, retaining mouse ranges
# and window-list scrolling. Only Termux adds a system row above it.
set -g status on
set -gu status-format
set -gF @dots-tmux-row "#{status-format[0]}"
if-shell -F '#{!=:#{TERMUX_VERSION},}' {
  set -g detach-on-destroy on
  set -g status 2
  # Per-client numeric width limits leave room for the native window list.
  set -g @dots-termux-badge-width '#{?#{e|<:#{?client_width,#{client_width},80},120},#{e|/|:#{?client_width,#{client_width},80},4},30}'
  set -g @dots-termux-name-width '#{e|-|:#{E:@dots-termux-badge-width},#{?#{E:@dots-termux-current},#{e|+|:3,#{n:#{E:@dots-termux-current}}},2}}'
  set -g @dots-termux-label '#{E:@dots-termux-current}#{?@dots-termux-default,,#{?#{e|>:#{E:@dots-termux-name-width},0},#{?#{E:@dots-termux-current},:,}#{=/#{E:@dots-termux-name-width}/;q/h:session_name},}}'
  set -g status-left '#[bg=#{@dots-termux-current-bg},fg=#{@dots-termux-current-fg},bold,nounderscore]#{?#{E:@dots-termux-label}, #{E:@dots-termux-label} ,}#[default]'
  # All three fields reuse the same per-client job; names stay in tmux formats.
  set -g @dots-termux-numbers '#(python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/termux-status.py" --tty=#{q:client_tty} #{q:@dots-termux-inactive-bg} #{q:@dots-termux-inactive-fg} #{q:@dots-termux-current-bg} #{q:@dots-termux-current-fg} --split-badge --width=#{?#{e|<:#{?client_width,#{client_width},80},80},#{e|/|:#{?client_width,#{client_width},80},4},20} 2>/dev/null || printf "\n")'
  set -g @dots-termux-before '#{s/[|].*$//:#{E:@dots-termux-numbers}}'
  set -g @dots-termux-current '#{s/^[^|]*[|]//:#{s/[|][^|]*$//:#{E:@dots-termux-numbers}}}'
  set -g @dots-termux-after '#{s/^[^|]*[|][^|]*[|]//:#{E:@dots-termux-numbers}}'
  # Insert later numbers after the native window list and before mode indicators.
  set -gF @dots-termux-window-row '#{s/#[[]nolist align=right.*$//:@dots-tmux-row}'
  set -gF @dots-termux-right-row '#{s/^.*#[[]nolist align=right/#[nolist align=right/:@dots-tmux-row}'
  set -g status-format[1] '#[fill=#{@dots-termux-lower-bg},bg=#{@dots-termux-lower-bg}]#[push-default]#[align=left,norange]#{E:@dots-termux-before}#[default]#{E:@dots-termux-window-row}#[nolist align=left norange default]#{E:@dots-termux-after}#{E:@dots-termux-right-row}#[pop-default]'
  # A bounded weather cache read may schedule HTTP work, never Android location.
  set -g @dots-termux-daylight '#(python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/weather-status.py" 2>/dev/null || printf "unknown\n")'
  set -g @dots-termux-daylight-fg '#{?#{==:#{E:@dots-termux-daylight},day},#{@dots-termux-yellow},#{?#{==:#{E:@dots-termux-daylight},night},#{@dots-termux-blue},#{@dots-termux-fg}}}'
  set -g status-format[0] '#[fill=#{@dots-termux-bg},bg=#{@dots-termux-bg},fg=#{@dots-termux-fg}]#[push-default]#[align=left,bold,bg=#{@dots-termux-clock-bg},fg=#{E:@dots-termux-daylight-fg}] %-I:%M #[default nobold align=right]#(bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/battery-status.sh" --slot #{q:@dots-termux-red} #{q:@dots-termux-yellow} #{q:@dots-termux-green} #{q:@dots-termux-muted} 2>/dev/null || printf "      ") #[pop-default]'
}
