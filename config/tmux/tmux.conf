# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Browse keybinding categories" ? run-shell -b 'DOTS_KEYS_TARGET_PANE=#{pane_id} dots keys --browse; _dots_keys_status=$?; if [ "$_dots_keys_status" -eq 130 ]; then exit 0; fi; exit "$_dots_keys_status"'
bind -N "Open Dots menu" m run-shell -b -c '#{pane_current_path}' 'TMUX=#{q:socket_path},0,0 TMUX_PANE=#{pane_id} dots menu --browse --client #{q:client_name} 2>&1; _dots_menu_status=$?; if [ "$_dots_menu_status" -eq 130 ]; then exit 0; fi; exit "$_dots_menu_status"'
bind -N "Choose tmux session" s run-shell -b -c '#{pane_current_path}' 'TMUX=#{q:socket_path},0,0 TMUX_PANE=#{pane_id} dots menu tmux sessions --browse --client #{q:client_name} 2>&1; _dots_menu_status=$?; if [ "$_dots_menu_status" -eq 130 ]; then exit 0; fi; exit "$_dots_menu_status"'

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create workspace" C run-shell -b 'TMUX=#{q:socket_path},0,0 TMUX_PANE=#{pane_id} python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" create --socket #{q:socket_path} --client #{q:client_name} --pane #{pane_id}'
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 31
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=#{?#{!=:#{TERMUX_VERSION},},#{@dots-termux-lower-bg},default},fg=default"
set -g @dots-termux-bg default
set -g @dots-termux-fg default
set -g @dots-termux-inactive-bg black
set -g @dots-termux-inactive-fg brightblack
set -g @dots-termux-current-bg brightblack
set -g @dots-termux-current-fg brightcyan
set -g @dots-termux-tab-current-fg colour208
set -g @dots-termux-lower-bg default
set -g @dots-termux-window-bg black
set -g @dots-termux-window-fg white
set -g @dots-termux-selected-bg brightblack
set -g @dots-window-selected-fg brightgreen
set -g @dots-window-name-current-fg brightwhite
set -g @dots-window-name-current-bg brightblack
set -g @dots-window-name-inactive-fg brightblack
set -g @dots-window-name-codex-fg white
set -g @dots-window-number-inactive-fg brightblack
set -g @dots-window-number-codex-fg magenta
set -g @dots-window-codex-fg blue
set -g @dots-window-codex-working-fg blue
set -g @dots-window-alert-fg brightred
set -g @dots-window-alert-bg black
set -g @dots-separator-fg default
set -g @dots-separator-bg black
set -g @dots-label-separator-fg black
set -g @dots-termux-clock-bg black
set -g @dots-termux-clock-fg default
set -g @dots-termux-muted brightblack
set -g @dots-termux-hint cyan
set -g @dots-termux-red red
set -g @dots-termux-yellow yellow
set -g @dots-termux-green green
set -g @dots-termux-blue blue
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
set -g popup-border-lines single  # single double rounded heavy simple padded none
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=brightblack,bg=default"
set -g @dots-indicator-fg black
set -g @dots-indicator-bg green
set -g @dots-prefix-fg blue
set -g @dots-prefix-bg black

# Gitmux reads these options from its linked YAML; old themes keep fallbacks.
set -g @dots-gitmux-branch magenta
set -g @dots-gitmux-staged green
set -g @dots-gitmux-modified yellow
set -g @dots-gitmux-untracked magenta
set -g @dots-gitmux-conflict red
set -g @dots-gitmux-clean green
set -g @dots-gitmux-added green
set -g @dots-gitmux-deleted red
set -g @dots-gitmux-ahead green
set -g @dots-gitmux-behind yellow
set -g @dots-gitmux-warning yellow
set -g @dots-gitmux-stash cyan
set -g @dots-gitmux-muted brightblack

# Shared dots colors; optional until first activation.
source-file -q -F "#{d:current_file}/dots-theme.conf"

# Layout belongs here, after the include (including older generated themes).
# These literal formats are shared by every platform and generated palette.
set -g @dots-status-separator '#[fg=#{@dots-separator-fg},bg=#{@dots-separator-bg},nobold,nounderscore,noreverse,nodim]│#[default]'
set -g @dots-label-separator '#[fg=#{@dots-label-separator-fg},nobold,nounderscore,noreverse,nodim] '
set -g @dots-session-style '#[bg=#{@dots-termux-current-bg},fg=#{@dots-termux-current-fg},bold,noreverse,nounderscore,nodim]'
# Keep plain labels separate from styled separators and budget by display cells.
set -g @dots-session-number ''
set -g @dots-session-display-name '#{?@dots-workspace-data,#{?@dots-workspace-auto,#{@dots-workspace-label},#{session_name}},#{?@dots-termux-default,,#{session_name}}}'
set -g @dots-session-width 31
set -g @dots-session-marker '#{?#{E:@dots-windows-visible},,#{E:@dots-window-marker}}'
set -g @dots-session-marker-width '#{?#{!=:#{E:@dots-session-marker},},#{e|+|:#{w:#{E:@dots-session-marker}},1},0}'
set -g @dots-session-content-width '#{e|-|:#{E:@dots-session-width},#{E:@dots-session-marker-width}}'
set -g @dots-session-prefix-width '#{?#{!=:#{E:@dots-session-number},},#{e|+|:#{w:#{E:@dots-session-number}},1},0}'
set -g @dots-session-icon '#{?#{e|>=:#{E:@dots-session-content-width},#{e|+|:2,#{e|+|:#{E:@dots-session-prefix-width},#{w:#{E:@dots-remote-icon}}}}},#{E:@dots-remote-icon},}'
set -g @dots-session-name-width '#{e|-|:#{E:@dots-session-content-width},#{e|+|:2,#{e|+|:#{E:@dots-session-prefix-width},#{?#{!=:#{E:@dots-session-icon},},#{e|+|:#{w:#{E:@dots-session-icon}},1},0}}}}'
set -g @dots-session-name '#{?#{e|>:#{E:@dots-session-name-width},0},#{?@dots-workspace-auto,#{=/#{E:@dots-session-name-width}/;q/h:@dots-workspace-label},#{?@dots-workspace-data,#{=/#{E:@dots-session-name-width}/;q/h:session_name},#{?@dots-termux-default,,#{=/#{E:@dots-session-name-width}/;q/h:session_name}}}},}'
set -g @dots-session-tail '#{E:@dots-session-icon}#{?#{&&:#{!=:#{E:@dots-session-icon},},#{!=:#{E:@dots-session-name},}}, ,}#{E:@dots-session-name}'
set -g @dots-session-has-separator '#{&&:#{!=:#{E:@dots-session-number},},#{!=:#{E:@dots-session-tail},}}'
set -g @dots-session-body-label '#{E:@dots-session-number}#{?#{E:@dots-session-has-separator}, ,}#{E:@dots-session-tail}'
set -g @dots-session-label '#{E:@dots-session-body-label}#{?#{!=:#{E:@dots-session-marker},},#{?#{!=:#{E:@dots-session-body-label},}, ,}#{E:@dots-session-marker},}'
set -g @dots-session-text '#{E:@dots-session-number}#{?#{E:@dots-session-has-separator},#{E:@dots-label-separator}#{E:@dots-session-style},}#{E:@dots-session-icon}#{?#{&&:#{!=:#{E:@dots-session-icon},},#{!=:#{E:@dots-session-name},}}, ,}#{?#{!=:#{E:@dots-session-name},},#{E:@dots-session-name},}#{?#{!=:#{E:@dots-session-marker},},#{?#{!=:#{E:@dots-session-body-label},}, ,}#[fg=#{@dots-window-codex-fg}]#{E:@dots-session-marker}#{E:@dots-session-style},}'
set -g @dots-session-visible '#{||:#{!=:#{E:@dots-session-marker},},#{||:#{!=:#{@dots-session-number},},#{||:#{!=:#{E:@dots-session-display-name},},#{!=:#{E:@dots-remote-icon},}}}}'
# Every window reuses this bounded inventory job; titles become boolean flags.
set -g @dots-codex-snapshot '#(python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-status.py" #{q:socket_path} 2>/dev/null || printf "\n")'
set -g @dots-window-codex '#{m:*|#{window_id}:*|*,#{E:@dots-codex-snapshot}}'
set -g @dots-window-codex-working '#{m:*|#{window_id}:working|*,#{E:@dots-codex-snapshot}}'
set -g @dots-window-codex-waiting '#{m:*|#{window_id}:waiting|*,#{E:@dots-codex-snapshot}}'
set -qog @dots-icon-status-working ''
set -qog @dots-icon-status-waiting ''
set -g @dots-window-marker '#{?#{E:@dots-window-codex-working},#{@dots-icon-status-working},#{?#{E:@dots-window-codex-waiting},#{@dots-icon-status-waiting},}}'
set -g @dots-window-codex-attention '#{m:*|#{window_id}:attention|*,#{E:@dots-codex-snapshot}}'
set -g @dots-window-alert '#{||:#{E:@dots-window-codex-attention},#{||:#{window_bell_flag},#{||:#{window_activity_flag},#{window_silence_flag}}}}'
set -g @dots-window-number '#{?#{e|>:#{session_windows},1},#I,}'
set -g @dots-window-prefix '#{E:@dots-window-number}'
set -g @dots-window-styled-prefix '#{?#{!=:#{E:@dots-window-number},},#{E:@dots-window-number-style}#{E:@dots-window-number}#{E:@dots-window-style},}'
set -g @dots-window-styled-marker '#{?#{!=:#{E:@dots-window-marker},},#{?#{||:#{!=:#{E:@dots-window-number},},#{!=:#{E:@dots-window-name},}}, ,}#{?window_active,#{?#{E:@dots-window-alert},,#[fg=#{@dots-window-codex-fg}]},}#{E:@dots-window-marker}#{?window_active,#{?#{E:@dots-window-alert},,#[fg=#{@dots-window-selected-fg}]},},}'
set -g @dots-window-name '#{?#{==:#{window_name},#{?#{&&:#{@dots-workspace-auto},#{!=:#{@dots-workspace-label},}},#{@dots-workspace-label},#{session_name}}},,#{q/h:window_name}}'
set -g @dots-window-label '#{E:@dots-window-prefix}#{?#{&&:#{!=:#{E:@dots-window-prefix},},#{!=:#{E:@dots-window-name},}}, ,}#{E:@dots-window-name}#{?#{!=:#{E:@dots-window-marker},},#{?#{||:#{!=:#{E:@dots-window-number},},#{!=:#{E:@dots-window-name},}}, ,}#{E:@dots-window-marker},}'
set -g @dots-window-styled-label '#{E:@dots-window-styled-prefix}#{?#{!=:#{E:@dots-window-name},},#{?#{!=:#{E:@dots-window-prefix},},#{E:@dots-label-separator},}#{E:@dots-window-name-style}#{E:@dots-window-name}#{E:@dots-window-style},}#{E:@dots-window-styled-marker}'
set -g @dots-window-text '#{?#{E:@dots-window-alert},[#{?#{!=:#{E:@dots-window-label},},#{?#{E:@dots-window-codex-attention},#{E:@dots-window-label},#{E:@dots-window-styled-label}},#{q/h:window_name}}],#{E:@dots-window-styled-label}}'
# A hidden singleton lends its state marker to the session section.
set -g @dots-windows-visible '#{||:#{e|>:#{session_windows},1},#{||:#{!=:#{E:@dots-window-name},},#{E:@dots-window-alert}}}'
set -g @dots-window-idle-style '#[fg=#{?#{E:@dots-window-codex-working},#{@dots-window-codex-working-fg},#{?#{E:@dots-window-codex},#{@dots-window-codex-fg},#{?#{!=:#{TERMUX_VERSION},},#{@dots-termux-window-fg},#{@dots-termux-muted}}}},bg=#{?#{!=:#{TERMUX_VERSION},},#{@dots-termux-window-bg},default},#{?#{E:@dots-window-codex-working},bold,nobold},nounderscore,noreverse,nodim]'
set -g @dots-window-selected-style '#[fg=#{@dots-window-selected-fg},bg=#{@dots-termux-selected-bg},bold,nounderscore,noreverse,nodim]'
set -g @dots-window-alert-style '#[fg=#{@dots-window-alert-fg},bg=#{@dots-window-alert-bg},bold,nounderscore,noreverse,nodim]'
set -g @dots-window-style '#{?#{E:@dots-window-alert},#{E:@dots-window-alert-style},#{?window_active,#{E:@dots-window-selected-style},#{E:@dots-window-idle-style}}}'
# These spans inherit the section style already emitted by window-format.
# Override only changed attributes; avoid re-expanding Codex state per span.
# Inactive markers inherit accent; current markers override and restore only fg.
set -g @dots-window-number-style '#{?#{||:#{E:@dots-window-alert},#{window_active}},,#[fg=#{?#{E:@dots-window-codex},#{@dots-window-number-codex-fg},#{@dots-window-number-inactive-fg}}]#[bold]}'
set -g @dots-window-name-style '#[fg=#{?#{E:@dots-window-alert},#{@dots-window-alert-fg},#{?window_active,#{@dots-window-name-current-fg},#{?#{E:@dots-window-codex},#{@dots-window-name-codex-fg},#{@dots-window-name-inactive-fg}}}},bold,#{?#{||:#{E:@dots-window-alert},#{window_active}},nodim,dim}]#{?#{E:@dots-window-alert},,#{?window_active,#[bg=#{@dots-window-name-current-bg}],}}'
set -g @dots-window-format '#{?#{E:@dots-windows-visible},#{E:@dots-window-style}#{?#{E:@dots-window-alert},, }#{E:@dots-window-text}#{?#{E:@dots-window-alert},, }#[default],}'
set -g window-status-format '#{E:@dots-window-format}'
set -g window-status-current-format '#{E:@dots-window-format}'
set -g window-status-current-style none
set -g window-status-activity-style 'fg=#{@dots-window-alert-fg},bg=#{@dots-window-alert-bg},bold,nounderscore,noreverse'
set -g window-status-bell-style 'fg=#{@dots-window-alert-fg},bg=#{@dots-window-alert-bg},bold,nounderscore,noreverse'
set -g window-status-separator '#{E:@dots-status-separator}'
set -g status-left '#{?#{E:@dots-session-visible},#{E:@dots-session-style} #{E:@dots-session-text} #[default]#{?#{E:@dots-windows-visible},#{E:@dots-status-separator},},}'
set -g status-right '#[fg=#{@dots-indicator-fg},bg=#{@dots-indicator-bg},bold]#{?pane_in_mode, COPY ,}#[default]#[fg=#{@dots-prefix-fg},bg=#{@dots-prefix-bg},bold]#{?client_prefix, PREFIX ,}#[default]#[fg=#{@dots-indicator-fg},bg=#{@dots-indicator-bg},bold]#{?window_zoomed_flag, ZOOM ,}#[default]'

# One asynchronous job per active pane directory; failure clears stale text.
set -g @dots-git-snapshot '#(python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/gitmux-status.py" --snapshot #{q:pane_current_path} 2>/dev/null || printf "\n")'
set -g @dots-remote-icon '#{s/[|].*$//:#{E:@dots-git-snapshot}}'
set -g @dots-gitmux '#{s/^[^|]*[|]//:#{E:@dots-git-snapshot}}'
set -g @dots-gitmux-width '#{?#{e|<:#{?client_width,#{client_width},80},96},#{e|/|:#{?client_width,#{client_width},80},2},48}'
set -g @dots-gitmux-preceded '#{||:#{E:@dots-session-visible},#{E:@dots-windows-visible}}'
set -g @dots-gitmux-segment '#[nolist align=left norange default]#{?#{!=:#{E:@dots-gitmux},},#{?#{E:@dots-gitmux-preceded},#{E:@dots-status-separator},} #{=/#{e|-:#{E:@dots-gitmux-width},1}/…:#{E:@dots-gitmux}} #[default],}'

# Start from tmux's standard window row on every reload, retaining mouse ranges
# and window-list scrolling. Only Termux adds a system row above it.
set -g status on
set -gu status-format
set -gF @dots-tmux-row "#{status-format[0]}"
set -gF @dots-tmux-window-row '#{s/#[[]nolist align=right.*$//:@dots-tmux-row}'
set -gF @dots-tmux-left-row '#{s/#[[]list=on align=.*$//:@dots-tmux-row}'
set -gF @dots-tmux-right-row '#{s/^.*#[[]nolist align=right/#[nolist align=right/:@dots-tmux-row}'
# An empty native list suppresses following text in tmux; omit its directives
# when the singleton window label is hidden, retaining the ordinary left/right.
set -g status-format[0] '#{?#{E:@dots-windows-visible},#{E:@dots-tmux-window-row},#{E:@dots-tmux-left-row}}#{E:@dots-gitmux-segment}#{E:@dots-tmux-right-row}'
if-shell -F '#{!=:#{TERMUX_VERSION},}' {
  set -g detach-on-destroy on
  set -g status 2
  # Termux tab numbers belong only to the upper row. Tmux numbers are session-local.
  set -g @dots-termux-badge-width '#{?#{e|<:#{?client_width,#{client_width},80},120},#{e|/|:#{?client_width,#{client_width},80},4},30}'
  set -g @dots-session-width '#{E:@dots-termux-badge-width}'
  set -g @dots-termux-numbers '#(python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/termux-status.py" --tty=#{q:client_tty} #{q:@dots-termux-inactive-bg} #{q:@dots-termux-inactive-fg} #{q:@dots-termux-current-bg} #{q:@dots-termux-tab-current-fg} --tabs --alert-fg=#{q:@dots-window-alert-fg} --alert-bg=#{q:@dots-window-alert-bg} --separator-fg=#{q:@dots-separator-fg} --separator-bg=#{q:@dots-separator-bg} --width=#{?#{e|<:#{?client_width,#{client_width},80},18},0,#{?#{e|<:#{?client_width,#{client_width},80},48},#{e|-:#{?client_width,#{client_width},80},18},30}} 2>/dev/null || printf "\n")'
  set -g @dots-termux-before ''
  set -g @dots-termux-current ''
  set -g @dots-termux-after ''
  set -g status-format[1] '#[fill=#{@dots-termux-lower-bg},bg=#{@dots-termux-lower-bg}]#[push-default]#{?#{E:@dots-windows-visible},#{E:@dots-tmux-window-row},#{E:@dots-tmux-left-row}}#{E:@dots-gitmux-segment}#{E:@dots-tmux-right-row}#[pop-default]'
  # A bounded weather cache read may schedule HTTP work, never Android location.
  set -g @dots-termux-daylight '#(python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/weather-status.py" 2>/dev/null || printf "unknown\n")'
  set -g @dots-termux-daylight-fg '#{?#{==:#{E:@dots-termux-daylight},day},#{@dots-termux-yellow},#{?#{==:#{E:@dots-termux-daylight},night},#{@dots-termux-blue},#{@dots-termux-fg}}}'
  set -g status-format[0] '#[fill=#{@dots-termux-bg},bg=#{@dots-termux-bg},fg=#{@dots-termux-fg}]#[push-default]#[align=left,bold,bg=#{@dots-termux-clock-bg},fg=#{E:@dots-termux-daylight-fg}] %-I:%M #[default]#{?#{!=:#{E:@dots-termux-numbers},},#{E:@dots-status-separator}#{E:@dots-termux-numbers},}#[default nobold align=right]#(bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/battery-status.sh" --slot #{q:@dots-termux-red} #{q:@dots-termux-yellow} #{q:@dots-termux-green} #{q:@dots-termux-muted} 2>/dev/null || printf "      ") #[pop-default]'
}

# Explicit acknowledgement is reliable even when Termux cannot report focus.
bind -N "Acknowledge Codex alert in this pane" a run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-alerts.py" ack-pane --socket #{q:socket_path} --client #{q:client_name} --pane #{pane_id} >/dev/null 2>&1 || :'

# Named hook slots compose with user hooks and stay idempotent on reload.
# These are inert until the explicit Codex notification setup has been applied.
set-hook -g after-select-pane[81] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-alerts.py" ack --socket #{q:socket_path} >/dev/null 2>&1 || :' }
set-hook -g after-select-window[81] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-alerts.py" ack --socket #{q:socket_path} >/dev/null 2>&1 || :' }
set-hook -g client-focus-in[81] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-alerts.py" ack --socket #{q:socket_path} >/dev/null 2>&1 || :' }
set-hook -g client-attached[81] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-alerts.py" ack --socket #{q:socket_path} >/dev/null 2>&1 || :' }
set-hook -g client-session-changed[81] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-alerts.py" ack --socket #{q:socket_path} >/dev/null 2>&1 || :' }
run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-alerts.py" start --socket #{q:socket_path} >/dev/null 2>&1 || :'
set-hook -g session-created[80] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" numbers --socket #{q:socket_path} >/dev/null 2>&1' }
set-hook -g session-closed[80] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" numbers --socket #{q:socket_path} >/dev/null 2>&1' }
set-hook -g after-new-window[80] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" reconcile --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1' }
set-hook -g after-split-window[80] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" reconcile --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1' }
set-hook -g window-unlinked[80] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" reconcile --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1' }
set-hook -g pane-exited[80] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" reconcile --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1' }
set-hook -g after-kill-pane[80] { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" reconcile --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1' }
set-hook -g after-rename-session[80] { if-shell -F '#{||:#{==:#{@dots-workspace-auto},0},#{!=:#{session_name},#{@dots-workspace-expected}}}' { run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" reconcile --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1' } }
run-shell -b 'python3 -B "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/workspace-control.py" numbers --socket #{q:socket_path} >/dev/null 2>&1'
