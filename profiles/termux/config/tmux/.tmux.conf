set -g default-command "${SHELL}"

set -g mouse on

set -g status-interval 1
set -g escape-time 20
set -g repeat-time 350
set -g display-time 1500

# set -g default-terminal 'screen-256color'
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ',xterm-256color:Tc'


set -gq allow-passthrough all
set -g visual-activity off

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file "~/.tmux.conf" \; display-message "Config reloading.."

bind C-a send-prefix

set -g history-limit 10000

setw -g monitor-activity off

unbind-key C-z

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jabirali/tmux-tilish'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

set -g @cpu_low_fg_color "#{E:#{@thm_green}}"
set -g @cpu_medium_fg_color "#{E:#{@thm_yellow}}"
set -g @cpu_high_fg_color "#{E:#{@thm_red}}"
set -g @cpu_medium_thresh "80"
set -g @cpu_high_thresh "90"

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g status-position top
set -g status-style "bg=#{@thm_mantle}"
set -g status-justify "left"

# setw -g pane-border-status top
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

default_window_number="#[fg=#{@thm_overlay_0}]#(~/.tmux/scripts/custom_number.sh '#I' 'hsquare')"
default_window_name="#[fg=#{@thm_overlay_0}]#{?#{==:#{window_name},window},#{pane_current_command},#W}"

current_window_number="#[fg=#{@thm_peach}]#(~/.tmux/scripts/custom_number.sh '#I' 'dsquare')"
current_window_name="#[fg=#{@thm_fg}]#{?#{==:#{window_name},window},#{pane_current_command},#W}"

set -gF window-status-separator "#[fg=#{@thm_surface_2}]"
set -g window-status-format " $default_window_number$default_window_name "
set -g window-status-style "bg=default"

set -g window-status-current-format " $current_window_number$current_window_name "
set -g window-status-current-style "bg=#{@thm_bg},bold"

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_surface_0},none]│"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_surface_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_surface_0},none]│"


set -g status-right-length 100
set -g status-right ""

# set -ga status-right "#[fg=#{cpu_fg_color}]#{E:#{@custom_status_inline}} 󰍛 #{cpu_percentage} "

# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_surface_0},none]│"

# set -ga status-right "#[fg=#(~/dots/androidots/bin/btry -c hex)] #(~/dots/androidots/bin/btry -nc -l) "

set -g message-style "bg=#{@thm_bg}, fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_mantle}, fg=#{@thm_fg}"

set -g @tilish-default 'tiled'

set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
  if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
