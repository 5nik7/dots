[apps.tmux.battery.icon]
bg = "dark_background"

[apps.tmux.battery.spacer]
bg = "dark_background"

[apps.tmux.battery.surround]
bg = "dark_background"

[apps.tmux.battery.text]
bg = "dark_background"

[apps.todo.field.alias.label]
fg = "blue"

[apps.todo.field.alias.value]
bold = true
fg = "blue"

[apps.todo.field.completed.value]
fg = "reset"

[apps.todo.field.notes.value]
fg = "light_foreground"

[apps.todo.field.tags.label]
bg = "default"

[apps.todo.field.tags.value]
dim = true
fg = "default"

[apps.todo.field.title.value]
bold = true

[apps.todo.priority.high]
bold = true
fg = "warning"
underline = true

[apps.todo.priority.normal]
dim = false
fg = "orange"

[apps.todo.status.blocked]
bold = true
fg = "bright_cyan"

[apps.todo.status.doing]
bold = true
fg = "bright_green"

[apps.todo.status.open]
fg = "muted"

[ui.accent]
fg = "accent"
