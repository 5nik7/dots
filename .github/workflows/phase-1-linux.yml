name: Phase 1 native Linux

on:
  push:
    branches: [feat/phase-1-portability]

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Provision CI development prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends hyperfine binutils
      - name: Native verification and startup measurements
        run: python3 -B experiments/go-portability/tools/ci_verify.py
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-1-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dots-linux-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
