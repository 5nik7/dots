name: Native portability and core commands

on:
  push:
    branches: [feat/phase-1-portability, feat/phase-2-core-registry, feat/phase-2-external-dispatch, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Provision CI development prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends hyperfine binutils
      - name: Native verification and distribution checks
        run: python3 -B experiments/go-portability/tools/ci_verify.py
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-1-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dots-linux-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Native permanent core checks and measurements
        run: python3 -B tools/ci_core.py
      - name: Retain permanent core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-2-core-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dots-core-linux-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  native-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Provision CI development prerequisites
        shell: pwsh
        run: |
          choco install hyperfine --version=1.20.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'hyperfine provisioning failed' }
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'llvm-readobj.exe'))) {
            throw 'Missing runner prerequisite: LLVM llvm-readobj.exe'
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Native verification and distribution checks
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python -B experiments/go-portability/tools/ci_verify.py
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-1-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dots-windows-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Native permanent core checks and measurements
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python -B tools/ci_core.py
      - name: Retain permanent core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-2-core-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dots-core-windows-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
