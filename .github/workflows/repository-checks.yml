name: Repository checks

on:
  push:
    branches: [main]
    paths: ['**/*.md', 'tools/verify_docs.py', 'tools/test_verify_docs.py', '.dots/wiki.json', 'bin/dots*', 'lib/dots/wiki*.py', 'lib/dots/command_metadata.py', 'tools/test_wiki*.py', '.github/workflows/repository-checks.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.md', 'tools/verify_docs.py', 'tools/test_verify_docs.py', '.dots/wiki.json', 'bin/dots*', 'lib/dots/wiki*.py', 'lib/dots/command_metadata.py', 'tools/test_wiki*.py', '.github/workflows/repository-checks.yml']

permissions:
  contents: read

jobs:
  repository-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          submodules: false
          persist-credentials: false
      - name: Documentation checker regressions
        run: python -B tools/test_verify_docs.py
      - name: Wiki generation regressions
        run: python -B tools/test_wiki.py
      - name: Wiki source consistency
        run: python -B lib/dots/wiki.py check --source-only
      - name: Documentation links
        run: python -B tools/verify_docs.py
      - name: Whitespace
        run: git show --format= --check HEAD
