"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 10000
scan_timeout = 10000

format = """
${custom.gh}\
$directory\
$username\
$hostname\
$git_branch\
$git_commit\
$git_status\
$git_metrics\
$git_state\
$aws\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$package\
$line_break\
$character"""

# Right side of the prompt
right_format = "$cmd_duration $time"

add_newline = true

palette = "mocha"

[palettes.mocha]
rosewater = '#f5e0dc'
flamingo = '#f2adcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'
pop = '#242438'

[character]
success_symbol = "[->](bold green)"
error_symbol = "[->](bold red)"
vimcmd_symbol = '[󰫻](fg:blue bold)'
# vicmd_symbol = "[❮](bold yellow)"
# success_symbol = '[](fg:color_ok bold)'
# error_symbol = '[](fg:color_danger bold)'

[custom.gh]
description = "Git host icon"
when = true
command = "git remote get-url origin 2>/dev/null | grep -iq 'github' && echo "
format = '([$output ]($style))'
style = 'fg:sapphire'
# symbol = "󰊤"
# shell = ["bash", "--noprofile", "--norc"]

[directory]
style = "fg:sapphire bold"
format = "[$path]($style) "
# format = "[ ]($style)[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "red"

[username]
style_user = "fg:bright-cyan bold"
style_root = "fg:red bold"
format = '[\[$user\]]($style)'     #Remove '\[' or '\]' if you do not want brackets
show_always = true

[hostname]
format = "[@$hostname:](fg:bright-cyan bold)"
ssh_only = false

[git_branch]
symbol = " "
style = "fg:mauve bold"
format = '[$symbol$branch·]($style)'

[git_commit]
style = "fg:mauve"
format = "([($tag)(@$hash)]($style) )"
commit_hash_length = 7
only_detached = true
tag_symbol = "󰓼 "
tag_disabled = false
disabled = false

[git_status]
style = "fg:bright-purple"
format = '([$ahead_behind]($style) )([$all_status]($style) )'
stashed = "*${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
up_to_date = ""
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "×${count}"
renamed = "»${count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
ignore_submodules = false
disabled = false

[git_metrics]
format = '([([+$added]($added_style))([-$deleted]($deleted_style))](fg:cyan) )'
added_style = "fg:bright-green"
deleted_style = "fg:bright-red"
only_nonzero_diffs = true
disabled = false

[git_state]
style = "fg:red"
format = '([$state( $progress_current/$progress_total)]($style bold) )'
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
disabled = false

[nodejs]
symbol = "⬢ "
style = "green"
format = "[$symbol($version)]($style) "

[lua]
format = 'via [🌕 $version](bold blue) '

[python]
symbol = " "
style = "blue"
format = "[$symbol($version)]($style) "

[rust]
symbol = "🦀 "
style = "red"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = "🐳 "
style = "blue bold"
format = "[$symbol$context]($style) "

[terraform]
format = '[🏎💨 $workspace]($style) '

[aws]
format = "on [$symbol($profile)(($region))]($style) "
symbol = "  "
style = "bold yellow"
disabled = true
[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'

[azure]
disabled = false
format = "on [$symbol($username)]($style) "
symbol = "󰠅 "
style = "blue bold"

[package]
symbol = "📦 "
style = "208 bold"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 200
format = '[\(⏱ $duration\)]($style) '
style = "fg:yellow bold"

[time]
disabled = false
time_format = "%-I:%M:%S"
format = "[$time]($style) "
style = "fg:overlay1 bold"
