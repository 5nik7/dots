# Semantic styles resolve against the addressed Dots theme.
[status.error]
fg = "error"


[status.info]
fg = "info"


[status.success]
fg = "green"


[status.waiting]
fg = "warning"


[status.warning]
fg = "warning"


[status.working]
bold = true
fg = "accent"


[ui.accent]
fg = "magenta"


[ui.foreground]
fg = "foreground"


[ui.heading]
bold = true
fg = "cyan"


[ui.identity]
bold = true
fg = "blue"


[ui.label]
fg = "blue"


[ui.muted]
fg = "muted"


[ui.selection]
bg = "selection_background"
bold = true
fg = "bright_foreground"

# Shared controls; native overrides preserve each consumer's existing defaults.

[ui.border]
fg = "lighter_background"

[ui.cursor]
fg = "bright_foreground"

[ui.match]
fg = "bright_magenta"

[ui.separator]
fg = "background"

[apps.gum.ui.border]
fg = "magenta"

[apps.gum.ui.match]
fg = "magenta"

[apps.todo.status.open]
fg = "bright_green"
bold = true

[apps.todo.status.doing]
fg = "blue"

[apps.todo.status.blocked]
fg = "warning"

[apps.todo.status.done]
fg = "green"

[apps.todo.status.removed]
fg = "muted"

[apps.todo.priority.high]
fg = "warning"
bold = true

[apps.todo.priority.normal]
fg = "orange"

[apps.todo.priority.low]
fg = "muted"
bold = true

[apps.tmux.windows.active]
fg = "bright_green"
bg = "selection_background"

[apps.tmux.windows.inactive]
fg = "light_foreground"
bg = "dark_background"

[apps.tmux.windows.alert]
fg = "bright_red"
bg = "darker_background"

[apps.tmux.pane.active_border]
fg = "selection"

[apps.tmux.pane.inactive_border]
fg = "muted"


[apps.fzf.ui.cursor]
fg = "accent"


[apps.menu.icon]
fg = "accent"


[apps.menu.label]
fg = "blue"


[apps.menu.description]
fg = "muted"


[apps.menu.shortcut]
fg = "cyan"


[apps.menu.state]
fg = "warning"


[apps.todo.field.id.label]
fg = "blue"

[apps.todo.field.id.value]
fg = "muted"


[apps.todo.field.alias.label]
fg = "blue"

[apps.todo.field.alias.value]
fg = "cyan"


[apps.todo.field.title.label]
fg = "blue"

[apps.todo.field.title.value]
fg = "bright_foreground"


[apps.todo.field.notes.label]
fg = "blue"

[apps.todo.field.notes.value]
fg = "foreground"


[apps.todo.field.tags.label]
fg = "blue"

[apps.todo.field.tags.value]
fg = "foreground"


[apps.todo.field.status.label]
fg = "blue"


[apps.todo.field.priority.label]
fg = "blue"


[apps.todo.field.due.label]
fg = "blue"

[apps.todo.field.due.value]
fg = "foreground"


[apps.todo.field.parent.label]
fg = "blue"

[apps.todo.field.parent.value]
fg = "foreground"


[apps.todo.field.acceptance.label]
fg = "blue"

[apps.todo.field.acceptance.value]
fg = "foreground"


[apps.todo.field.subgoal_id.label]
fg = "blue"

[apps.todo.field.subgoal_id.value]
fg = "muted"


[apps.todo.field.subgoal_title.label]
fg = "blue"

[apps.todo.field.subgoal_title.value]
fg = "bright_foreground"


[apps.todo.field.subgoals.label]
fg = "blue"

[apps.todo.field.subgoals.value]
fg = "foreground"


[apps.todo.field.created.label]
fg = "blue"

[apps.todo.field.created.value]
fg = "muted"


[apps.todo.field.updated.label]
fg = "blue"

[apps.todo.field.updated.value]
fg = "muted"


[apps.todo.field.completed.label]
fg = "blue"

[apps.todo.field.completed.value]
fg = "muted"


[apps.todo.field.removed.label]
fg = "blue"

[apps.todo.field.removed.value]
fg = "muted"

# Shared daylight and battery roles; component overrides remain independent.

[daylight.day]
fg = "yellow"

[daylight.night]
fg = "blue"

[daylight.sunrise]
fg = "yellow"

[daylight.sunset]
fg = "orange"

[battery.critical]
fg = "red"

[battery.low]
fg = "yellow"

[battery.normal]
fg = "green"

[battery.charging]
fg = "colors.battery.normal.fg"

[battery.unknown]
fg = "muted"


[apps.tmux.session.repository]
fg = "colors.ui.accent.fg"

# Native activity markers keep their existing accent; profile-wide overrides
# still win over these shared application defaults.
[apps.tmux.status.working]
fg = "colors.ui.accent.fg"
[apps.tmux.status.waiting]
fg = "colors.ui.accent.fg"
