# Semantic styles resolve against the addressed Dots theme.
[status.error]
fg = "error"

[status.info]
fg = "info"

[status.success]
fg = "green"

[status.waiting]
fg = "warning"

[status.warning]
fg = "warning"

[status.working]
bold = true
fg = "accent"

[ui.accent]
fg = "magenta"

[ui.foreground]
fg = "foreground"

[ui.heading]
bold = true
fg = "cyan"

[ui.identity]
bold = true
fg = "blue"

[ui.label]
fg = "blue"

[ui.muted]
fg = "muted"

[ui.selection]
bg = "selection_background"
bold = true
fg = "bright_foreground"

# Shared controls; native overrides preserve each consumer's existing defaults.
[ui.border]
fg = "lighter_background"
[ui.cursor]
fg = "bright_foreground"
[ui.match]
fg = "bright_magenta"
[ui.separator]
fg = "background"
[apps.gum.ui.border]
fg = "magenta"
[apps.gum.ui.match]
fg = "magenta"
[todo.status.open]
fg = "bright_green"
bold = true
[todo.status.doing]
fg = "blue"
[todo.status.blocked]
fg = "warning"
[todo.status.done]
fg = "green"
[todo.status.removed]
fg = "muted"
[todo.priority.high]
